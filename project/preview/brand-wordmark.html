<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wordmark Lockup</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .card { padding: 0; height: 240px; background: #1a1410; position: relative; overflow: hidden; }
  /* faux warm light gradient */
  .card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 70% at 50% 110%, rgba(212,175,55,0.25), transparent 60%); }
  .stage { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; }
  .ornament { color: #d4af37; opacity: 0.5; font-size: 18px; letter-spacing: 0.4em; }
  .mark { width: 40px; height: 40px; color: #d4af37; opacity: 0.85; }
  .word { font-family: var(--font-serif); font-size: 36px; letter-spacing: 0.22em; color: #f8f4e8; line-height: 1; font-weight: 400; }
  .sub  { font-family: var(--font-sans); font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase; color: rgba(248,244,232,0.55); font-weight: 300; }
</style>
</head>
<body>
<div class="card">
  <div class="stage">
    <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M32 4 L32 14" stroke-linecap="round"/>
      <path d="M27 14 H37 M28.5 17 H35.5 M30 20 H34" stroke-linecap="round"/>
      <rect x="27" y="22" width="10" height="5"/>
      <path d="M14 48 Q14 28 32 28 Q50 28 50 48 Z"/>
      <rect x="10" y="48" width="44" height="3"/>
      <rect x="6"  y="53" width="52" height="3"/>
    </svg>
    <div class="word">RUWANWELISAYA</div>
    <div class="sub">The Great Stupa &nbsp;·&nbsp; Anuradhapura</div>
  </div>
</div>
</body>
</html>
