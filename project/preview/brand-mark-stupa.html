<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand Mark — Stupa</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .card { padding: 28px 32px; display: flex; align-items: center; gap: 28px; }
  .well { width: 130px; height: 130px; background: #faf8f5; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #d4af37; flex-shrink: 0; }
  .well svg { width: 88px; height: 88px; }
  .info h3 { font-family: var(--font-serif); font-size: 18px; color: #333; font-weight: 400; margin-bottom: 6px; }
  .info p { font-family: var(--font-sans); font-size: 12px; line-height: 1.6; color: #666; }
  .info .meta { font-family: var(--font-mono); font-size: 10px; color: #999; margin-top: 10px; }
  .swatches { display: flex; gap: 8px; margin-top: 12px; }
  .swatches .s { width: 38px; height: 38px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .s1 { background: #fff; color: #d4af37; border: 1px solid rgba(212,175,55,0.2); }
  .s2 { background: #faf8f5; color: #c77b2b; }
  .s3 { background: #0f0f0f; color: #d4af37; }
  .s4 { background: linear-gradient(135deg, #d4af37, #c77b2b); color: #fff; }
  .swatches svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<div class="card">
  <div class="well">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M32 4 L32 14" stroke-linecap="round"/>
      <path d="M27 14 H37 M28.5 17 H35.5 M30 20 H34" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="27" y="22" width="10" height="5" stroke-width="1.4"/>
      <path d="M14 48 Q14 28 32 28 Q50 28 50 48 Z" stroke-width="1.6"/>
      <rect x="10" y="48" width="44" height="3" stroke-width="1.4"/>
      <rect x="6"  y="53" width="52" height="3" stroke-width="1.4"/>
    </svg>
  </div>
  <div class="info">
    <h3>Stupa Mark</h3>
    <p>Pinnacle · chathra · harmika · anda · vahalkadas. The full stupa silhouette, drawn for this design system to replace the ☸️ emoji in the navbar.</p>
    <div class="meta">assets/mark-stupa.svg · stroke-only · currentColor</div>
    <div class="swatches">
      <div class="s s1"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 48 Q14 28 32 28 Q50 28 50 48 Z"/><rect x="27" y="22" width="10" height="5"/></svg></div>
      <div class="s s2"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 48 Q14 28 32 28 Q50 28 50 48 Z"/><rect x="27" y="22" width="10" height="5"/></svg></div>
      <div class="s s3"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 48 Q14 28 32 28 Q50 28 50 48 Z"/><rect x="27" y="22" width="10" height="5"/></svg></div>
      <div class="s s4"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 48 Q14 28 32 28 Q50 28 50 48 Z"/><rect x="27" y="22" width="10" height="5"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
