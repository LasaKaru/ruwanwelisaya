<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand Colors</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 0; }
  .card { width: 700px; height: 200px; padding: 0; display: flex; }
  .sw { flex: 1; padding: 20px 18px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
  .sw .name { font-family: var(--font-serif); font-size: 14px; letter-spacing: 0.05em; }
  .sw .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
  .sw .role { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; }
  .gold      { background: #d4af37; color: #fff; }
  .gold-l    { background: #e8d48b; color: #5a4818; }
  .gold-d    { background: #b8941f; color: #fff; }
  .saffron   { background: #c77b2b; color: #fff; }
  .saffron-l { background: #e8a84c; color: #5a3a12; }
</style>
</head>
<body>
<div class="card">
  <div class="sw gold">
    <div class="role">Primary</div>
    <div>
      <div class="name">Pinnacle Gold</div>
      <div class="hex">#d4af37</div>
    </div>
  </div>
  <div class="sw gold-l">
    <div class="role">Tint</div>
    <div>
      <div class="name">Gold Light</div>
      <div class="hex">#e8d48b</div>
    </div>
  </div>
  <div class="sw gold-d">
    <div class="role">Shade</div>
    <div>
      <div class="name">Gold Dark</div>
      <div class="hex">#b8941f</div>
    </div>
  </div>
  <div class="sw saffron">
    <div class="role">Secondary</div>
    <div>
      <div class="name">Saffron</div>
      <div class="hex">#c77b2b</div>
    </div>
  </div>
  <div class="sw saffron-l">
    <div class="role">Tint</div>
    <div>
      <div class="name">Saffron Light</div>
      <div class="hex">#e8a84c</div>
    </div>
  </div>
</div>
</body>
</html>
