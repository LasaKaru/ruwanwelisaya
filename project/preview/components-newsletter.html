<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Newsletter Signup</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .card { padding: 32px; }
  .nl { background: linear-gradient(90deg, rgba(212,175,55,0.10), rgba(245,232,180,0.30) 50%, rgba(212,175,55,0.10)); border: 1px solid rgba(212,175,55,0.15); border-radius: 8px; padding: 22px; }
  .head { display: flex; align-items: center; gap: 8px; color: #333; margin-bottom: 8px; }
  .head svg { color: #d4af37; }
  .head h3 { font-family: var(--font-serif); font-size: 15px; font-weight: 400; }
  .desc { font-family: var(--font-sans); font-size: 11px; color: #666; line-height: 1.6; margin-bottom: 14px; }
  .form { display: flex; gap: 8px; }
  .form input { flex: 1; padding: 10px 12px; background: #fff; border: 1px solid rgba(212,175,55,0.15); border-radius: 2px; font-family: var(--font-sans); font-size: 13px; color: #333; outline: none; }
  .form input::placeholder { color: #999; }
  .form button { padding: 10px 16px; background: linear-gradient(135deg, #d4af37, #c77b2b); color: #fff; font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; border: 0; border-radius: 2px; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="nl">
    <div class="head">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      <h3>Sacred Newsletter</h3>
    </div>
    <p class="desc">Receive Poya day reminders, temple updates, and spiritual inspiration in your inbox.</p>
    <form class="form" onsubmit="return false;">
      <input type="email" placeholder="your@email.com" />
      <button type="submit">Join</button>
    </form>
  </div>
</div>
</body>
</html>
