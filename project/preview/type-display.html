<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Display Type — Cinzel</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .card { padding: 32px 32px 28px; }
  .wordmark { font-family: var(--font-serif); font-size: 56px; letter-spacing: 0.18em; color: #333; line-height: 1; }
  .sub { font-family: var(--font-sans); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(0,0,0,0.5); margin-top: 14px; font-weight: 300; }
  .meta-row { display: flex; gap: 16px; margin-top: 22px; font-family: var(--font-mono); font-size: 10px; color: var(--light-grey); }
  .meta-row span b { color: #333; font-family: var(--font-serif); font-weight: 400; }
</style>
</head>
<body>
<div class="card">
  <div class="wordmark">RUWANWELISAYA</div>
  <div class="sub">The Great Stupa &nbsp;•&nbsp; Anuradhapura</div>
  <div class="meta-row">
    <span><b>Cinzel</b> 56px / 1.0 / +0.18em</span>
    <span>weight 400</span>
    <span>uppercase</span>
  </div>
</div>
</body>
</html>
