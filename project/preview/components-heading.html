<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Section Heading</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .card { padding: 36px 32px; text-align: center; }
  .h2 { font-family: var(--font-serif); font-size: 36px; color: #333; letter-spacing: 0.02em; line-height: 1.1; font-weight: 400; }
  .accent { width: 64px; height: 2px; background: linear-gradient(135deg, #d4af37, #c77b2b); border-radius: 9999px; margin: 14px auto 18px; }
  .sub { font-family: var(--font-sans); font-size: 14px; line-height: 1.6; color: #666; max-width: 460px; margin: 0 auto; }
  .spec { font-family: var(--font-mono); font-size: 10px; color: var(--light-grey); margin-top: 22px; padding-top: 16px; border-top: 1px dashed rgba(0,0,0,0.06); }
</style>
</head>
<body>
<div class="card">
  <h2 class="h2">A Legacy of Devotion</h2>
  <div class="accent"></div>
  <p class="sub">Built by King Dutugemunu in 140 BCE, the Ruwanwelisaya stands as one of the tallest ancient monuments in the world and remains a living symbol of faith.</p>
  <div class="spec">Cinzel 36px · 64×2 gold-gradient accent · 460px max-width subtitle</div>
</div>
</body>
</html>
