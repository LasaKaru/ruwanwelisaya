<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brand Marks — Ornament Set</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .card { padding: 26px 32px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; background: #faf8f5; border-radius: 8px; }
  .item svg { width: 64px; height: 64px; color: #d4af37; }
  .nm { font-family: var(--font-serif); font-size: 13px; color: #333; }
  .ml { font-family: var(--font-mono); font-size: 9px; color: var(--light-grey); }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="item">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <ellipse cx="32" cy="20" rx="5" ry="11"/>
        <ellipse cx="32" cy="44" rx="5" ry="11"/>
        <ellipse cx="20" cy="32" rx="11" ry="5"/>
        <ellipse cx="44" cy="32" rx="11" ry="5"/>
        <ellipse cx="23.5" cy="23.5" rx="5" ry="11" transform="rotate(-45 23.5 23.5)"/>
        <ellipse cx="40.5" cy="40.5" rx="5" ry="11" transform="rotate(-45 40.5 40.5)"/>
        <ellipse cx="40.5" cy="23.5" rx="5" ry="11" transform="rotate(45 40.5 23.5)"/>
        <ellipse cx="23.5" cy="40.5" rx="5" ry="11" transform="rotate(45 23.5 40.5)"/>
        <circle cx="32" cy="32" r="3" fill="currentColor"/>
      </svg>
      <div class="nm">Lotus</div>
      <div class="ml">dividers, ornaments</div>
    </div>
    <div class="item">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="32" cy="32" r="26"/>
        <circle cx="32" cy="32" r="6" fill="currentColor"/>
        <g stroke-linecap="round">
          <line x1="32" y1="6"  x2="32" y2="58"/>
          <line x1="6"  y1="32" x2="58" y2="32"/>
          <line x1="13.6" y1="13.6" x2="50.4" y2="50.4"/>
          <line x1="50.4" y1="13.6" x2="13.6" y2="50.4"/>
        </g>
      </svg>
      <div class="nm">Dharmacakra</div>
      <div class="ml">8-spoke noble path</div>
    </div>
    <div class="item">
      <svg viewBox="0 0 64 80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
        <path d="M30 14 L34 14 L33 22 L31 22 Z" fill="currentColor"/>
        <ellipse cx="32" cy="30" rx="20" ry="4"/>
        <path d="M12 30 Q12 44 22 47 L42 47 Q52 44 52 30"/>
        <path d="M26 47 L26 58 L38 58 L38 47"/>
        <ellipse cx="32" cy="60" rx="16" ry="3"/>
        <ellipse cx="32" cy="64" rx="22" ry="4"/>
        <path d="M32 6 Q28 10 30 14 Q32 12 32 14 Q34 12 34 14 Q36 10 32 6 Z" fill="currentColor"/>
      </svg>
      <div class="nm">Oil Lamp</div>
      <div class="ml">light-a-lamp ritual</div>
    </div>
  </div>
</div>
</body>
</html>
