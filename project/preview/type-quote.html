<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quote Style</title>
<link rel="stylesheet" href="_shared.css">
<style>
  .card { padding: 36px 40px; background: #faf8f5; text-align: center; }
  .lotus { color: #d4af37; opacity: 0.4; letter-spacing: 0.4em; font-size: 14px; margin-bottom: 14px; }
  .eyb { font-family: var(--font-sans); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #d4af37; margin-bottom: 18px; font-weight: 500; }
  .quote { font-family: var(--font-serif); font-style: italic; font-size: 20px; line-height: 1.7; color: #333; }
  .src { font-family: var(--font-sans); font-size: 12px; color: #666; margin-top: 14px; }
  .div { width: 64px; height: 1px; margin: 20px auto 0; background: linear-gradient(90deg, transparent, rgba(212,175,55,0.4), transparent); }
</style>
</head>
<body>
<div class="card">
  <div class="lotus">✿ ✿ ✿</div>
  <div class="eyb">Today's Dhamma</div>
  <p class="quote">&ldquo;Better than a thousand hollow words is one word that brings peace.&rdquo;</p>
  <p class="src">— Dhammapada, Verse 100</p>
  <div class="div"></div>
</div>
</body>
</html>
