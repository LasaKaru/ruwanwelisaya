<style>
  /* ============================================================
     RUWANWELISAYA — UI KIT (single-page click-through)
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: #fefdfb;
    color: #333;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  ::selection { background: rgba(212,175,55,0.2); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #f8f9fa; }
  ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 3px; }

  :root {
    --pinnacle-gold: #d4af37;
    --saffron: #c77b2b;
    --cream: #faf8f5;
    --warm-white: #fefdfb;
    --dark: #333;
    --med: #666;
    --light: #999;
    --gold-grad: linear-gradient(135deg, #d4af37 0%, #c77b2b 100%);
    --border-gold: 1px solid rgba(212,175,55,0.10);
    --border-gold-strong: 1px solid rgba(212,175,55,0.30);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* ---------- Fade-in primitive ---------- */
  .rw-fade { opacity: 0; transform: translateY(40px); transition: opacity 800ms var(--ease-out), transform 800ms var(--ease-out); }
  .rw-fade.is-in { opacity: 1; transform: none; }

  /* ============================================================
     NAV
     ============================================================ */
  .rw-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; transition: background 500ms, box-shadow 500ms, border-color 500ms; background: transparent; }
  .rw-nav.is-scrolled { background: rgba(255,255,255,0.78); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(212,175,55,0.15); box-shadow: 0 1px 12px rgba(0,0,0,0.04); }
  .rw-nav__inner { max-width: 1280px; margin: 0 auto; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
  .rw-nav__brand { display: flex; align-items: center; gap: 12px; }
  .rw-nav__mark { width: 36px; height: 36px; border-radius: 9999px; background: var(--gold-grad); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(212,175,55,0.25); }
  .rw-nav__wordmark { font-family: "Cinzel", serif; font-size: 15px; letter-spacing: 0.18em; color: #fff; transition: color 500ms; font-weight: 500; }
  .rw-nav__wordmark.on-light { color: #333 !important; }
  .rw-nav__links { display: flex; align-items: center; gap: 28px; }
  .rw-nav__links ul { display: flex; gap: 24px; list-style: none; }
  .rw-nav__links a { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.9); transition: color 300ms; position: relative; padding: 4px 0; font-weight: 500; }
  .rw-nav__links a.on-light { color: #333 !important; }
  .rw-nav__links a:hover { color: var(--pinnacle-gold); }
  .rw-nav__links a::after { content: ''; position: absolute; left: 0; bottom: -2px; height: 1px; width: 0; background: var(--pinnacle-gold); transition: width 300ms; }
  .rw-nav__links a:hover::after, .rw-nav__links a.is-active::after { width: 100%; }
  .rw-nav__links a.is-active { color: var(--pinnacle-gold) !important; }
  .rw-nav__theme { padding: 6px; border-radius: 9999px; color: rgba(255,255,255,0.85); transition: background 300ms, color 300ms; display: inline-flex; }
  .rw-nav__theme.on-light { color: #333 !important; }
  .rw-nav__theme:hover { background: rgba(212,175,55,0.10); color: var(--pinnacle-gold); }
  .rw-nav__menu-btn { display: none; padding: 8px; color: rgba(255,255,255,0.9); }
  .rw-nav__menu-btn.on-light { color: #333 !important; }
  .rw-nav__mobile { display: none; }

  @media (max-width: 880px) {
    .rw-nav__links { display: none; }
    .rw-nav__menu-btn { display: inline-flex; }
    .rw-nav__mobile { display: block; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(212,175,55,0.15); padding: 20px 28px; }
    .rw-nav__mobile ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    .rw-nav__mobile a { font-family: "Cinzel", serif; font-size: 18px; letter-spacing: 0.18em; color: var(--dark); }
    .rw-nav__mobile a.is-active { color: var(--pinnacle-gold); }
  }

  /* ============================================================
     LAYOUT HELPERS
     ============================================================ */
  .rw-main { min-height: 100vh; }
  .rw-container { max-width: 1200px; margin: 0 auto; padding: 0 28px; }

  .rw-container--narrow { max-width: 720px; }
  .rw-section { padding: 120px 0; }
  .rw-section--tight { padding: 60px 0; }

  /* ============================================================
     HERO
     ============================================================ */
  .rw-hero { position: relative; height: 100vh; min-height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; color: #fff; }
  .rw-hero__bg { position: absolute; inset: 0; z-index: 0; }
  .rw-hero__photo--stupa { display: none; }
  .rw-hero__scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.65) 100%); }
  .rw-hero__content { position: relative; z-index: 1; text-align: center; padding: 0 24px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .rw-hero__ornament { animation: rw-float 6s ease-in-out infinite; }
  @keyframes rw-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .rw-hero__wordmark { font-family: "Cinzel", serif; font-size: clamp(3rem, 9vw, 7.5rem); letter-spacing: 0.05em; line-height: 1; font-weight: 400; text-shadow: 0 4px 24px rgba(0,0,0,0.4); }
  .rw-hero__sub { font-size: 11px; letter-spacing: 0.36em; color: rgba(255,255,255,0.7); font-weight: 300; }
  .rw-hero__cta { margin-top: 16px; }
  .rw-hero__scroll { position: absolute; bottom: 36px; z-index: 1; width: 22px; height: 36px; border: 1.5px solid rgba(255,255,255,0.4); border-radius: 9999px; display: flex; justify-content: center; padding-top: 6px; animation: rw-fade-up 1s 1.4s var(--ease-out) backwards; }
  @keyframes rw-fade-up { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
  .rw-hero__scroll-dot { width: 3px; height: 6px; background: rgba(255,255,255,0.6); border-radius: 9999px; animation: rw-bob 2s var(--ease-out) infinite; }
  @keyframes rw-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }

  /* ============================================================
     QUICK INFO BAR
     ============================================================ */
  .rw-info-bar { background: var(--cream); padding: 40px 0; border-top: 1px solid rgba(212,175,55,0.10); border-bottom: 1px solid rgba(212,175,55,0.10); }
  .rw-info-bar__inner { max-width: 1100px; margin: 0 auto; padding: 0 28px; display: flex; gap: 64px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .rw-info-bar__item { display: flex; align-items: center; gap: 14px; }
  .rw-info-bar__lbl { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--light); font-weight: 500; }
  .rw-info-bar__val { font-size: 13px; font-weight: 500; color: var(--dark); margin-top: 2px; }

  /* ============================================================
     TYPE PRIMITIVES
     ============================================================ */
  .rw-eyebrow { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--pinnacle-gold); font-weight: 500; display: inline-block; }
  .rw-eyebrow.is-light { color: rgba(255,255,255,0.85); }
  .rw-h2 { font-family: "Cinzel", serif; font-size: clamp(1.75rem, 3.5vw, 2.5rem); letter-spacing: 0.02em; line-height: 1.15; color: var(--dark); font-weight: 400; }
  .rw-h3 { font-family: "Cinzel", serif; font-size: 20px; letter-spacing: 0.02em; color: var(--dark); margin-bottom: 16px; font-weight: 400; }
  .rw-body { font-size: 15px; line-height: 1.75; color: var(--med); margin-bottom: 18px; }
  .rw-body:last-child { margin-bottom: 0; }

  /* Section heading */
  .rw-sh { margin-bottom: 64px; }
  .rw-sh.is-centered { text-align: center; }
  .rw-sh__title { font-family: "Cinzel", serif; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: 0.02em; line-height: 1.1; color: var(--dark); margin-top: 12px; font-weight: 400; }
  .rw-sh.is-light .rw-sh__title { color: #fff; }
  .rw-sh__accent { width: 64px; height: 2px; background: var(--gold-grad); border-radius: 9999px; margin: 18px 0 0; }
  .rw-sh.is-centered .rw-sh__accent { margin: 18px auto 0; }
  .rw-sh__sub { font-size: 16px; line-height: 1.65; color: var(--med); margin-top: 22px; max-width: 600px; }
  .rw-sh.is-centered .rw-sh__sub { margin-left: auto; margin-right: auto; }
  .rw-sh.is-light .rw-sh__sub { color: rgba(255,255,255,0.75); }

  /* History grid */
  .rw-history__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; margin-top: 24px; }
  @media (max-width: 720px) { .rw-history__grid { grid-template-columns: 1fr; gap: 40px; } }

  /* ============================================================
     BUTTONS
     ============================================================ */
  .rw-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0; font-family: "Inter", sans-serif; text-transform: uppercase; letter-spacing: 0.15em; border-radius: 2px; transition: all 300ms var(--ease-out); border: 1px solid transparent; white-space: nowrap; font-weight: 500; }
  .rw-btn--sm { padding: 8px 18px; font-size: 11px; }
  .rw-btn--md { padding: 12px 24px; font-size: 12px; }
  .rw-btn--lg { padding: 16px 32px; font-size: 13px; }

  .rw-btn--primary { background: var(--gold-grad); color: #fff; box-shadow: 0 4px 16px rgba(212,175,55,0.20); }
  .rw-btn--primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(212,175,55,0.32); }
  .rw-btn--primary:active { transform: translateY(0); box-shadow: 0 4px 14px rgba(212,175,55,0.20); }

  .rw-btn--secondary { border-color: var(--pinnacle-gold); color: var(--pinnacle-gold); background: transparent; }
  .rw-btn--secondary:hover { background: var(--pinnacle-gold); color: #fff; }

  .rw-btn--hero { border: 1px solid rgba(255,255,255,0.4); color: #fff; background: transparent; backdrop-filter: blur(6px); }
  .rw-btn--hero:hover { background: #fff; color: var(--dark); transform: translateY(-2px); }

  .rw-btn--ghost { color: var(--pinnacle-gold); background: transparent; }
  .rw-btn--ghost:hover { background: rgba(212,175,55,0.08); }

  .rw-btn.is-disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
  .rw-btn:focus-visible { outline: 2px solid var(--pinnacle-gold); outline-offset: 3px; }

  /* ============================================================
     QUOTE
     ============================================================ */
  .rw-quote { max-width: 720px; margin: 0 auto; text-align: center; padding: 36px 24px; }
  .rw-lotus-triple { display: flex; gap: 14px; justify-content: center; margin-bottom: 20px; }
  .rw-quote__text { font-family: "Cinzel", serif; font-style: italic; font-size: clamp(1.15rem, 2.3vw, 1.4rem); line-height: 1.7; color: var(--dark); margin-top: 16px; }
  .rw-quote__src { font-size: 13px; color: var(--med); margin-top: 18px; }
  .rw-quote__line { width: 64px; height: 1px; margin: 28px auto 0; background: linear-gradient(90deg, transparent, rgba(212,175,55,0.4), transparent); }

  /* ============================================================
     GALLERY PREVIEW + PHOTO TILES
     ============================================================ */
  .rw-gallery-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  @media (max-width: 880px) { .rw-gallery-preview { grid-template-columns: 1fr; } }

  .rw-photo { position: relative; aspect-ratio: 4/5; border-radius: 8px; overflow: hidden; transition: transform 700ms var(--ease-out); cursor: pointer; }
  .rw-photo:hover { transform: scale(1.02); }
  /* Warm photographic tints — stand-ins for real pilgrim photography. */
  .rw-photo--amber   { background: linear-gradient(135deg, #c9882f 0%, #e8b878 40%, #f4d9a8 75%, #faecc8 100%); }
  .rw-photo--indigo  { background: linear-gradient(160deg, #1e1a3a 0%, #2d2a5a 35%, #3e3870 65%, #6a5a8a 100%); }
  .rw-photo--rose    { background: linear-gradient(150deg, #6b2820 0%, #a04835 35%, #c97558 65%, #e8a888 100%); }
  .rw-photo--stone   { background: linear-gradient(135deg, #4a4238 0%, #6d6256 40%, #948877 75%, #b8aa97 100%); }
  .rw-photo--sand    { background: linear-gradient(135deg, #8a6a3c 0%, #b69060 40%, #d9b88a 75%, #ecd5b0 100%); }
  .rw-photo--saffron { background: linear-gradient(135deg, #863818 0%, #c77b2b 40%, #e8a84c 75%, #f4cf88 100%); }
  .rw-photo--cream   { background: linear-gradient(135deg, #b89a72 0%, #d4b890 40%, #ecd9b8 75%, #faf2dd 100%); }

  .rw-photo__overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.55) 100%); }
  .rw-photo__caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 22px 20px; color: #fff; }
  .rw-photo__caption h3 { font-family: "Cinzel", serif; font-size: 17px; letter-spacing: 0.04em; margin-bottom: 4px; font-weight: 500; }
  .rw-photo__caption p { font-size: 12px; opacity: 0.85; }

  /* ============================================================
     FEATURE CARDS
     ============================================================ */
  .rw-features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  @media (max-width: 880px) { .rw-features { grid-template-columns: 1fr; } }
  .rw-feature { display: block; padding: 32px 30px; background: #fff; border: var(--border-gold); border-radius: 10px; transition: all 500ms var(--ease-out); }
  .rw-feature:hover { border-color: rgba(212,175,55,0.30); box-shadow: 0 12px 32px rgba(212,175,55,0.10); transform: translateY(-2px); }
  .rw-feature__icon { display: inline-flex; padding: 12px; background: rgba(212,175,55,0.08); border-radius: 9999px; transition: transform 400ms var(--ease-out); }
  .rw-feature:hover .rw-feature__icon { transform: scale(1.1); background: rgba(212,175,55,0.14); }
  .rw-feature h3 { font-family: "Cinzel", serif; font-size: 19px; color: var(--dark); margin: 22px 0 10px; font-weight: 400; }
  .rw-feature p { font-size: 14px; line-height: 1.65; color: var(--med); margin-bottom: 20px; }
  .rw-feature__more { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--pinnacle-gold); display: inline-flex; align-items: center; gap: 8px; }

  /* ============================================================
     DONATE CTA SECTION (homepage)
     ============================================================ */
  .rw-cta { position: relative; padding: 140px 0; overflow: hidden; color: #fff; text-align: center; }
  .rw-cta__bg { position: absolute; inset: 0; z-index: 0; }
  .rw-cta__photo {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 50% 45% at 50% 70%, rgba(212,175,55,0.18) 0%, transparent 70%),
      linear-gradient(180deg, #1a1410 0%, #2d1f15 50%, #3d2818 100%);
  }
  .rw-cta__scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
  .rw-cta__inner { position: relative; z-index: 1; }

     FOOTER
     ============================================================ */

  .rw-lotus-divider { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 36px 0; }

  @media (max-width: 540px) { .rw-footer__grid { grid-template-columns: 1fr; } }

  .rw-footer__col a:hover { color: var(--pinnacle-gold); }

  .rw-footer__newsletter { margin-top: 48px; }
  .rw-news { background: linear-gradient(90deg, rgba(212,175,55,0.10), rgba(245,232,180,0.30) 50%, rgba(212,175,55,0.10)); border: 1px solid rgba(212,175,55,0.15); border-radius: 10px; padding: 24px 28px; }

  .rw-news__form button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(212,175,55,0.25); }
  .rw-news__success { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #4f7d4f; padding: 4px 0; }

  .rw-footer__copyright { margin-top: 48px; padding-top: 24px; border-top: var(--border-gold); text-align: center; font-size: 11px; letter-spacing: 0.1em; color: var(--light); }

  /* ============================================================
     INTERIOR PAGE HEADER
     ============================================================ */
  .rw-page { padding-top: 80px; }
  .rw-page__header { padding: 60px 0 40px; }
  .rw-page__title { font-family: "Cinzel", serif; font-size: clamp(2.25rem, 5vw, 3.5rem); letter-spacing: 0.02em; line-height: 1.1; color: var(--dark); margin-top: 14px; font-weight: 400; }
  .rw-page__lead { font-size: 17px; line-height: 1.7; color: var(--med); margin-top: 24px; max-width: 620px; }

  /* ============================================================
     GALLERY PAGE
     ============================================================ */
  .rw-gallery { padding-bottom: 120px; }
  .rw-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 44px; }
  .rw-chip { padding: 8px 18px; border: 1px solid rgba(212,175,55,0.20); border-radius: 9999px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--med); transition: all 300ms; font-weight: 500; background: #fff; }
  .rw-chip:hover { border-color: rgba(212,175,55,0.50); color: var(--pinnacle-gold); }
  .rw-chip.is-active { background: var(--gold-grad); border-color: transparent; color: #fff; }

  .rw-masonry { columns: 3 280px; column-gap: 22px; }
  .rw-tile { break-inside: avoid; margin-bottom: 22px; }
  .rw-tile .rw-photo { aspect-ratio: 4/5; }
  .rw-tile--tall .rw-photo { aspect-ratio: 3/5; }

  /* ============================================================
     COMMUNITY / FORUM + LAMP
     ============================================================ */
  .rw-lamp-section { background: linear-gradient(180deg, #1a1410 0%, #2a1d14 100%); padding: 80px 0; }
  .rw-lamp { text-align: center; color: #fff; }
  .rw-lamp__lead { font-size: 13px; max-width: 420px; margin: 14px auto 36px; color: rgba(255,255,255,0.6); line-height: 1.6; }
  .rw-lamp__btn { position: relative; display: inline-flex; flex-direction: column; align-items: center; padding: 16px; border-radius: 12px; color: rgba(255,255,255,0.55); transition: color 600ms; }
  .rw-lamp__btn.is-lit { color: var(--pinnacle-gold); }
  .rw-lamp__svg { width: 130px; height: auto; }
  .rw-lamp__flame { transform-origin: 32px 14px; animation: rw-flicker 1.6s ease-in-out infinite; }
  @keyframes rw-flicker { 0%, 100% { opacity: 1; transform: scaleY(1); } 50% { opacity: 0.95; transform: scaleY(1.05); } }
  .rw-lamp__glow { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); width: 180px; height: 180px; border-radius: 9999px; background: radial-gradient(circle, rgba(212,175,55,0.0), transparent 70%); transition: background 800ms, box-shadow 800ms; pointer-events: none; }
  .rw-lamp__btn.is-lit .rw-lamp__glow { background: radial-gradient(circle, rgba(247,217,78,0.25), transparent 70%); box-shadow: 0 0 80px rgba(212,175,55,0.30); }
  .rw-lamp__prompt { margin-top: 10px; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--pinnacle-gold); animation: rw-pulse 2s ease-in-out infinite; font-weight: 500; }
  @keyframes rw-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  .rw-lamp__blessing { margin-top: 24px; animation: rw-fade-up 600ms var(--ease-out); }
  .rw-lamp__quote { font-family: "Cinzel", serif; font-style: italic; font-size: 17px; color: var(--pinnacle-gold); }
  .rw-lamp__quote-src { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 6px; }
  .rw-lamp__counter { margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.10); display: inline-block; padding-inline: 36px; }
  .rw-lamp__counter-lbl { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 6px; }
  .rw-lamp__counter-val { font-family: "Cinzel", serif; font-size: 32px; color: var(--pinnacle-gold); font-weight: 400; }

  .rw-forum-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  .rw-forum { display: flex; flex-direction: column; gap: 20px; }
  .rw-post { padding: 28px; background: #fff; border: var(--border-gold); border-radius: 10px; transition: border-color 300ms, box-shadow 300ms; }
  .rw-post:hover { border-color: rgba(212,175,55,0.25); }
  .rw-post__head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .rw-avatar { width: 40px; height: 40px; border-radius: 9999px; background: var(--gold-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-family: "Cinzel", serif; font-size: 13px; letter-spacing: 0.05em; font-weight: 500; }
  .rw-post__name { font-family: "Cinzel", serif; font-size: 14px; color: var(--dark); font-weight: 500; }
  .rw-post__sub { font-size: 11px; letter-spacing: 0.1em; color: var(--light); margin-top: 2px; }
  .rw-post__title { font-family: "Cinzel", serif; font-size: 19px; color: var(--dark); margin-bottom: 10px; font-weight: 400; line-height: 1.3; }
  .rw-post__body { font-size: 14px; line-height: 1.7; color: var(--med); margin-bottom: 18px; }
  .rw-post__actions { display: flex; gap: 22px; padding-top: 14px; border-top: 1px dashed rgba(212,175,55,0.15); }
  .rw-action { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--med); transition: color 200ms; padding: 6px 0; }
  .rw-action:hover { color: var(--pinnacle-gold); }
  .rw-action.is-on { color: #c44; }

  /* ============================================================
     DONATE PAGE
     ============================================================ */
  .rw-donate-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 56px; }
  @media (max-width: 880px) { .rw-donate-grid { grid-template-columns: 1fr; } }
  .rw-donate-card { background: #fff; padding: 36px; border-radius: 12px; border: var(--border-gold); }

  .rw-donate__form { display: flex; flex-direction: column; gap: 22px; }
  .rw-donate__group { display: flex; flex-direction: column; gap: 10px; }
  .rw-donate__lbl { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--light); font-weight: 500; }

  .rw-toggle { display: inline-flex; padding: 4px; background: var(--cream); border-radius: 9999px; border: 1px solid rgba(212,175,55,0.10); align-self: flex-start; }
  .rw-toggle button { padding: 8px 22px; font-size: 12px; letter-spacing: 0.1em; color: var(--med); border-radius: 9999px; transition: all 300ms; }
  .rw-toggle button.is-active { background: var(--gold-grad); color: #fff; }

  .rw-amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 540px) { .rw-amount-grid { grid-template-columns: 1fr 1fr; } }
  .rw-amount { padding: 14px 12px; border: 1px solid rgba(212,175,55,0.20); border-radius: 6px; font-size: 13px; color: var(--dark); transition: all 200ms; font-weight: 500; background: #fff; text-align: center; }
  .rw-amount:hover { border-color: rgba(212,175,55,0.50); }
  .rw-amount.is-active { background: rgba(212,175,55,0.10); border-color: var(--pinnacle-gold); color: var(--pinnacle-gold); }
  .rw-amount--custom { display: flex; align-items: center; gap: 4px; padding: 0 12px; }
  .rw-amount--custom input { flex: 1; padding: 12px 4px; border: 0; outline: 0; font-size: 13px; font-family: inherit; background: transparent; min-width: 0; }

  .rw-input { padding: 12px 14px; border: 1px solid rgba(212,175,55,0.20); border-radius: 4px; font-family: inherit; font-size: 14px; color: var(--dark); background: #fff; outline: none; transition: border-color 200ms; resize: vertical; }
  .rw-input:focus { border-color: rgba(212,175,55,0.55); }

  .rw-donate__submit { width: 100%; margin-top: 8px; }
  .rw-donate__legal { font-size: 11px; color: var(--light); line-height: 1.6; text-align: center; margin-top: 4px; }

  .rw-donate__success { text-align: center; padding: 24px 12px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .rw-donate__success-mark { width: 64px; height: 64px; border-radius: 9999px; background: rgba(212,175,55,0.10); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(212,175,55,0.30); }

  .rw-donate__aside { display: flex; flex-direction: column; gap: 32px; }
  .rw-alloc { list-style: none; display: flex; flex-direction: column; gap: 18px; }
  .rw-alloc__row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .rw-alloc__label { font-size: 13px; color: var(--med); }
  .rw-alloc__pct { font-family: "Cinzel", serif; font-size: 14px; color: var(--pinnacle-gold); }
  .rw-alloc__bar { height: 4px; background: rgba(212,175,55,0.10); border-radius: 9999px; overflow: hidden; }
  .rw-alloc__bar span { display: block; height: 100%; background: var(--gold-grad); border-radius: 9999px; }

  .rw-donate__quote { padding: 26px; background: var(--cream); border: var(--border-gold); border-radius: 10px; text-align: center; }
  .rw-donate__quote blockquote { font-family: "Cinzel", serif; font-style: italic; font-size: 15px; line-height: 1.6; color: var(--dark); margin: 14px 0 10px; }
  .rw-donate__quote p { font-size: 11px; letter-spacing: 0.1em; color: var(--light); }

  /* ============================================================
     STUPA SCENE (hero illustration)
     ============================================================ */
  .rw-hero--scene .rw-hero__bg { z-index: 0; }
  .rw-stupa-scene {
    position: absolute; inset: 0;
    overflow: hidden;
    background: linear-gradient(180deg,
      #10081a 0%,
      #2a1224 14%,
      #4a2018 28%,
      #7a3018 42%,
      #b04a18 56%,
      #d96c20 68%,
      #e8902c 78%,
      #f4b250 86%,
      #fad896 94%,
      #5a2a14 100%);
  }
  /* Sun halo behind the stupa */
  .rw-scene__sun {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 45% 38% at 50% 72%,
      rgba(255,244,200, 0.85) 0%,
      rgba(255,214,128, 0.50) 22%,
      rgba(232,136,40, 0.20) 50%,
      rgba(232,136,40, 0) 72%);
    pointer-events: none;
  }
  /* Foreground haze */
  .rw-scene__haze {
    position: absolute; left: 0; right: 0; bottom: 0; top: 65%;
    background: linear-gradient(180deg, rgba(58,28,16,0) 0%, rgba(20,10,4,0.55) 100%);
    pointer-events: none;
  }
  .rw-scene__svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .rw-scene__sky { display: none; }

  /* Pinnacle glow pulse */
  .rw-scene__pinnacle-glow { transform-origin: 800px 295px; animation: rw-pinnacle-pulse 3.6s ease-in-out infinite; }
  @keyframes rw-pinnacle-pulse {
    0%, 100% { opacity: 0.65; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.25); }
  }
  /* Birds drift */
  .rw-bird { transform-origin: center; animation: rw-bird-drift 28s linear infinite; }
  .rw-bird--1 { animation-duration: 32s; animation-delay: 0s;   }
  .rw-bird--2 { animation-duration: 38s; animation-delay: -8s;  }
  .rw-bird--3 { animation-duration: 30s; animation-delay: -4s;  animation-direction: reverse; }
  .rw-bird--4 { animation-duration: 36s; animation-delay: -12s; animation-direction: reverse; }
  .rw-bird--5 { animation-duration: 40s; animation-delay: -18s; }
  @keyframes rw-bird-drift {
    0%   { transform: translate(-40px, 0); opacity: 0; }
    10%  { opacity: 0.55; }
    50%  { transform: translate(80px, -14px); }
    90%  { opacity: 0.55; }
    100% { transform: translate(180px, 0); opacity: 0; }
  }
  /* Subtle parallax glow over the hero */
  .rw-hero--scene::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 50% 35% at 50% 65%, rgba(247,217,78,0.20) 0%, transparent 70%);
    z-index: 1; pointer-events: none;
    animation: rw-hero-breathe 8s ease-in-out infinite;
  }
  @keyframes rw-hero-breathe {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }

  /* ============================================================
     AD SLOTS
     ============================================================ */
  .rw-ad-wrap { padding: 32px 28px; }
  .rw-ad-wrap--tight { padding: 12px 28px; }
  .rw-ad { position: relative; border-radius: 8px; overflow: hidden; margin: 0 auto; max-width: 100%; }
  .rw-ad--leaderboard { min-height: 110px; max-width: 970px; }
  .rw-ad--rectangle   { min-height: 250px; max-width: 336px; }

  .rw-ad--empty {
    background: repeating-linear-gradient(45deg, #faf8f5 0 12px, #f1ecdf 12px 24px);
    border: 1px dashed rgba(212,175,55,0.30);
    display: flex; align-items: center; justify-content: center;
  }
  .rw-ad__pattern {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.6) 0%, transparent 60%);
    pointer-events: none;
  }
  .rw-ad__inner { position: relative; text-align: center; padding: 14px 22px; }
  .rw-ad__eyebrow { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--pinnacle-gold); font-weight: 500; }
  .rw-ad__id  { font-family: "Cinzel", serif; font-size: 17px; color: var(--dark); margin: 6px 0 6px; }
  .rw-ad__hint { font-size: 11px; color: var(--med); }
  .rw-ad__hint strong { color: var(--pinnacle-gold); font-weight: 500; }

  .rw-ad:not(.rw-ad--empty) { background: var(--cream); padding: 14px; border: 1px solid rgba(212,175,55,0.10); }
  .rw-ad__pin { position: absolute; top: 6px; right: 8px; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--light); }

  /* ============================================================
     ADMIN PANEL
     ============================================================ */
  .rw-admin-fab {
    position: fixed; bottom: 20px; left: 20px; z-index: 60;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: rgba(20, 16, 12, 0.85); color: #f6ecd8;
    border-radius: 9999px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(212,175,55,0.30);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    transition: transform 200ms var(--ease-out), background 200ms;
  }
  .rw-admin-fab:hover { transform: translateY(-2px); background: rgba(20,16,12,0.95); }
  .rw-admin-fab.is-open { background: var(--gold-grad); border-color: transparent; color: #fff; }

  .rw-admin {
    position: fixed; bottom: 76px; left: 20px; z-index: 60;
    width: 380px; max-width: calc(100vw - 40px);
    max-height: calc(100vh - 110px);
    background: #1a140e; color: #f0e6d6;
    border: 1px solid rgba(212,175,55,0.20);
    border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.4);
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: rw-admin-in 320ms var(--ease-out);
  }
  @keyframes rw-admin-in { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }

  .rw-admin__head { padding: 20px 22px 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 1px solid rgba(212,175,55,0.12); }
  .rw-admin__title { font-family: "Cinzel", serif; font-size: 20px; color: #f6ecd8; margin-top: 6px; font-weight: 400; letter-spacing: 0.02em; }
  .rw-admin__close { color: rgba(246,236,216,0.6); padding: 6px; }
  .rw-admin__close:hover { color: var(--pinnacle-gold); }

  .rw-admin__tabs { display: flex; gap: 4px; padding: 12px 22px; border-bottom: 1px solid rgba(212,175,55,0.10); background: rgba(0,0,0,0.20); }
  .rw-admin__tabs button { padding: 6px 12px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(246,236,216,0.55); border-radius: 4px; transition: all 200ms; font-weight: 500; }
  .rw-admin__tabs button:hover { color: var(--pinnacle-gold); }
  .rw-admin__tabs button.is-active { background: rgba(212,175,55,0.14); color: var(--pinnacle-gold); }

  .rw-admin__body { padding: 22px; overflow-y: auto; flex: 1; }
  .rw-admin__hint { font-size: 12px; line-height: 1.6; color: rgba(246,236,216,0.55); margin-bottom: 16px; }

  .rw-admin__group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .rw-admin__lbl { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(246,236,216,0.55); display: flex; justify-content: space-between; align-items: center; }
  .rw-admin__saved { font-size: 10px; letter-spacing: 0.15em; color: var(--pinnacle-gold); opacity: 0; transition: opacity 200ms; }
  .rw-admin__saved.is-on { opacity: 1; }

  .rw-admin__select, .rw-admin__code {
    background: rgba(0,0,0,0.30); color: #f6ecd8;
    border: 1px solid rgba(212,175,55,0.20);
    border-radius: 4px; padding: 10px 12px;
    font-family: "SF Mono", Menlo, monospace; font-size: 12px;
    outline: 0;
  }
  .rw-admin__code { line-height: 1.55; resize: vertical; min-height: 130px; }
  .rw-admin__select { font-family: inherit; }
  .rw-admin__select:focus, .rw-admin__code:focus { border-color: rgba(212,175,55,0.55); }

  .rw-admin__row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .rw-admin__btn { padding: 9px 16px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; border-radius: 4px; transition: all 200ms; font-weight: 500; }
  .rw-admin__btn { background: rgba(212,175,55,0.10); color: var(--pinnacle-gold); border: 1px solid rgba(212,175,55,0.25); }
  .rw-admin__btn:hover { background: rgba(212,175,55,0.18); border-color: rgba(212,175,55,0.50); }
  .rw-admin__btn--primary { background: var(--gold-grad); color: #fff; border-color: transparent; }
  .rw-admin__btn--primary:hover { background: var(--gold-grad); transform: translateY(-1px); }
  .rw-admin__btn--ghost { background: transparent; }
  .rw-admin__btn--danger { background: rgba(180, 72, 72, 0.18); color: #f4a8a8; border-color: rgba(180,72,72,0.40); }
  .rw-admin__btn--danger:hover { background: rgba(180,72,72,0.30); }

  .rw-admin__flags { display: flex; flex-direction: column; gap: 14px; }
  .rw-admin__toggle { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .rw-admin__toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .rw-admin__toggle-track { width: 38px; height: 22px; background: rgba(255,255,255,0.10); border-radius: 9999px; position: relative; transition: background 200ms; flex-shrink: 0; }
  .rw-admin__toggle-track span { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #f6ecd8; border-radius: 9999px; transition: transform 220ms var(--ease-out); }
  .rw-admin__toggle input:checked + .rw-admin__toggle-track { background: var(--gold-grad); }
  .rw-admin__toggle input:checked + .rw-admin__toggle-track span { transform: translateX(16px); }
  .rw-admin__toggle-lbl { font-size: 13px; color: rgba(246,236,216,0.88); }

  .rw-admin__foot { padding: 12px 22px; border-top: 1px solid rgba(212,175,55,0.10); font-size: 10px; letter-spacing: 0.12em; color: rgba(246,236,216,0.4); }
  .rw-admin__foot kbd { padding: 1px 6px; background: rgba(255,255,255,0.08); border-radius: 3px; font-family: "SF Mono", Menlo, monospace; font-size: 10px; color: var(--pinnacle-gold); }

  /* ============================================================
     BLOG
     ============================================================ */
  .rw-feature-post { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: center; background: var(--cream); border: var(--border-gold); border-radius: 12px; overflow: hidden; transition: all 400ms var(--ease-out); }
  .rw-feature-post:hover { border-color: rgba(212,175,55,0.30); transform: translateY(-2px); box-shadow: 0 16px 36px rgba(212,175,55,0.10); }
  @media (max-width: 720px) { .rw-feature-post { grid-template-columns: 1fr; gap: 0; } }
  .rw-feature-post__img { aspect-ratio: 4/3; border-radius: 0; }
  .rw-feature-post__body { padding: 32px 36px; }
  .rw-feature-post__title { font-family: "Cinzel", serif; font-size: clamp(1.5rem, 2.6vw, 2.1rem); line-height: 1.2; letter-spacing: 0.02em; color: var(--dark); margin: 14px 0 16px; font-weight: 400; }
  .rw-feature-post__excerpt { font-size: 15px; line-height: 1.7; color: var(--med); margin-bottom: 20px; }
  .rw-feature-post__meta { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 0.05em; color: var(--light); }

  .rw-blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  @media (max-width: 880px) { .rw-blog-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .rw-blog-grid { grid-template-columns: 1fr; } }
  .rw-post-card { display: block; background: #fff; border: var(--border-gold); border-radius: 10px; overflow: hidden; transition: all 400ms var(--ease-out); }
  .rw-post-card:hover { border-color: rgba(212,175,55,0.30); transform: translateY(-3px); box-shadow: 0 14px 32px rgba(212,175,55,0.10); }
  .rw-post-card__img { aspect-ratio: 4/3; border-radius: 0; transition: transform 600ms var(--ease-out); }
  .rw-post-card:hover .rw-post-card__img { transform: scale(1.04); }
  .rw-post-card__body { padding: 22px 24px 24px; }
  .rw-post-card__title { font-family: "Cinzel", serif; font-size: 17px; line-height: 1.3; color: var(--dark); margin: 10px 0 12px; font-weight: 400; }
  .rw-post-card__excerpt { font-size: 13px; line-height: 1.65; color: var(--med); margin-bottom: 14px; }
  .rw-post-card__meta { font-size: 11px; letter-spacing: 0.08em; color: var(--light); display: flex; align-items: center; gap: 8px; }
  .rw-dot { width: 3px; height: 3px; border-radius: 9999px; background: var(--light); }

  /* Blog detail */
  .rw-blog-detail { padding-top: 0; }
  .rw-blog-detail__hero { position: relative; aspect-ratio: auto; height: 56vh; min-height: 360px; border-radius: 0; padding-top: 80px; display: flex; align-items: flex-end; }
  .rw-photo__overlay--strong { background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.20) 50%, rgba(0,0,0,0.85) 100%); }
  .rw-blog-detail__hero-inner { position: relative; padding-bottom: 56px; color: #fff; }
  .rw-back { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.20); border-radius: 9999px; color: #fff; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 28px; transition: background 200ms; }
  .rw-back:hover { background: rgba(255,255,255,0.20); }
  .rw-blog-detail__title { font-family: "Cinzel", serif; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: 0.02em; line-height: 1.1; color: #fff; margin: 14px 0 18px; font-weight: 400; max-width: 900px; }
  .rw-blog-detail__meta { display: flex; gap: 10px; align-items: center; font-size: 13px; color: rgba(255,255,255,0.75); }
  .rw-blog-detail__meta .rw-dot { background: rgba(255,255,255,0.5); }
  .rw-blog-detail__body { padding: 72px 28px 80px; }
  .rw-lede { font-family: "Cinzel", serif; font-size: 20px; line-height: 1.6; color: var(--dark); margin-bottom: 32px; font-style: italic; font-weight: 400; }
  .rw-blog-quote { padding: 24px 32px; margin: 28px 0; border-left: 2px solid var(--pinnacle-gold); background: var(--cream); border-radius: 0 8px 8px 0; }
  .rw-blog-quote { font-family: "Cinzel", serif; font-size: 18px; font-style: italic; color: var(--dark); line-height: 1.6; }
  .rw-blog-quote cite { display: block; font-family: "Inter", sans-serif; font-size: 12px; font-style: normal; letter-spacing: 0.1em; color: var(--light); margin-top: 10px; }

  /* Article structured body */
  .rw-article__h2 { font-family: "Cinzel", serif; font-size: clamp(1.4rem, 2.6vw, 1.9rem); letter-spacing: 0.02em; line-height: 1.25; color: var(--dark); font-weight: 400; margin: 40px 0 4px; }
  .rw-article__li { font-size: 15px; line-height: 1.75; color: var(--med); margin: 0 0 8px 20px; }
  .rw-blog-detail__body .rw-body { margin-bottom: 20px; }
  .rw-blog-detail__body .rw-article__h2 + .rw-body { margin-top: 12px; }
  .rw-blog-detail__body .rw-ad { margin: 36px auto; }

  /* Tags */
  .rw-article__tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 40px 0 8px; }
  .rw-tag { font-size: 11px; letter-spacing: 0.06em; color: var(--med); background: var(--cream); border: 1px solid rgba(212,175,55,0.18); border-radius: 9999px; padding: 5px 14px; }

  /* Byline card */
  .rw-byline { display: flex; align-items: center; gap: 14px; margin-top: 36px; padding: 22px 24px; background: var(--cream); border: var(--border-gold); border-radius: 10px; }
  .rw-byline__avatar { width: 48px; height: 48px; border-radius: 9999px; background: var(--gold-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-family: "Cinzel", serif; font-size: 16px; font-weight: 500; flex-shrink: 0; }
  .rw-byline__name { font-family: "Cinzel", serif; font-size: 16px; color: var(--dark); font-weight: 500; }
  .rw-byline__role { font-size: 12px; color: var(--light); margin-top: 2px; }

  /* Chip count */
  .rw-chip__count { display: inline-block; margin-left: 4px; font-size: 9px; opacity: 0.7; vertical-align: super; }

  /* ============================================================
     STATIC PAGES (About / Contact / Privacy)
     ============================================================ */
  .rw-page__hero { position: relative; height: 38vh; min-height: 280px; padding-top: 80px; display: flex; align-items: flex-end; overflow: hidden; }
  .rw-page__hero--about   { background: linear-gradient(135deg, #1a1410 0%, #5a3c1c 55%, #b07a2a 100%); }
  .rw-page__hero--contact { background: linear-gradient(135deg, #14101a 0%, #3a2a4c 55%, #8a6a3a 100%); }
  .rw-page__hero-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.55)); }
  .rw-page__hero-inner { position: relative; z-index: 1; padding-bottom: 40px; }
  .rw-page__hero-title { font-family: "Cinzel", serif; font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: 0.02em; color: #fff; margin-top: 10px; font-weight: 400; }

  .rw-static { padding: 64px 28px 96px; }
  .rw-static .rw-article__h2 { margin-top: 44px; }
  .rw-static ul { margin: 8px 0 8px; }
  .rw-legal .rw-body { font-size: 14px; }

  .rw-values { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 36px 0; }
  @media (max-width: 600px) { .rw-values { grid-template-columns: 1fr; } }
  .rw-value { padding: 24px; background: var(--cream); border: var(--border-gold); border-radius: 10px; }
  .rw-value__icon { display: inline-flex; padding: 10px; background: rgba(212,175,55,0.10); border-radius: 9999px; }
  .rw-value h3 { font-family: "Cinzel", serif; font-size: 17px; color: var(--dark); font-weight: 400; margin: 14px 0 8px; }
  .rw-value p { font-size: 13px; line-height: 1.6; color: var(--med); }

  .rw-contact-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; }
  @media (max-width: 820px) { .rw-contact-grid { grid-template-columns: 1fr; gap: 36px; } }
  .rw-contact-list { list-style: none; display: flex; flex-direction: column; gap: 18px; margin: 18px 0 28px; }
  .rw-contact-list li { display: flex; gap: 12px; align-items: flex-start; }
  .rw-contact-list strong { display: block; font-family: "Cinzel", serif; font-size: 13px; color: var(--dark); font-weight: 500; }
  .rw-contact-list span { font-size: 13px; color: var(--med); }
  .rw-contact-note { padding: 18px 20px; background: var(--cream); border: var(--border-gold); border-radius: 10px; }
  .rw-contact-note p { font-size: 12px; line-height: 1.65; color: var(--med); }

  /* ============================================================
     FEEDBACK
     ============================================================ */
  .rw-feedback { background: #fff; border: var(--border-gold); border-radius: 12px; padding: 36px; max-width: 640px; margin: 0 auto; }
  .rw-feedback.is-compact { padding: 26px 28px; }
  .rw-feedback__title { font-family: "Cinzel", serif; font-size: 22px; color: var(--dark); margin: 12px 0 6px; font-weight: 400; line-height: 1.3; }
  .rw-feedback__lead { font-size: 13px; line-height: 1.6; color: var(--med); margin-bottom: 18px; }
  .rw-feedback__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  @media (max-width: 540px) { .rw-feedback__grid { grid-template-columns: 1fr; } }

  .rw-stars { display: flex; gap: 6px; margin: 8px 0 22px; }
  .rw-star { color: rgba(212,175,55,0.30); transition: transform 150ms var(--ease-out), color 150ms; padding: 2px; }
  .rw-star:hover { transform: scale(1.15); }
  .rw-star.is-on { color: var(--pinnacle-gold); animation: rw-star-pop 320ms var(--ease-out); }
  @keyframes rw-star-pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }

  .rw-feedback--sent { text-align: center; padding: 48px 24px; }
  .rw-feedback__sent-mark { display: inline-block; padding: 14px; background: rgba(212,175,55,0.10); border-radius: 9999px; }

  /* ============================================================
     PAYMENT METHODS
     ============================================================ */
  .rw-pay-methods { display: flex; flex-direction: column; gap: 10px; }
  .rw-pay-method { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: #fff; border: 1px solid rgba(212,175,55,0.20); border-radius: 8px; transition: all 200ms; text-align: left; }
  .rw-pay-method:hover { border-color: rgba(212,175,55,0.45); }
  .rw-pay-method.is-active { border-color: var(--pinnacle-gold); background: rgba(212,175,55,0.06); box-shadow: 0 0 0 3px rgba(212,175,55,0.08); }
  .rw-pay-method__mark { width: 56px; display: flex; align-items: center; justify-content: flex-start; flex-shrink: 0; }
  .rw-pay-method__info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .rw-pay-method__label { font-family: "Cinzel", serif; font-size: 14px; color: var(--dark); font-weight: 500; letter-spacing: 0.02em; }
  .rw-pay-method__sub { font-size: 11px; letter-spacing: 0.06em; color: var(--light); }
  .rw-pay-method__radio { width: 16px; height: 16px; border-radius: 9999px; border: 1.5px solid rgba(212,175,55,0.35); position: relative; flex-shrink: 0; transition: all 200ms; }
  .rw-pay-method.is-active .rw-pay-method__radio { border-color: var(--pinnacle-gold); background: var(--pinnacle-gold); box-shadow: inset 0 0 0 3px #fff; }

  .rw-pay-detail { padding: 18px; background: var(--cream); border: 1px dashed rgba(212,175,55,0.20); border-radius: 8px; animation: rw-pay-in 320ms var(--ease-out); }
  @keyframes rw-pay-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  .rw-pay-form { display: flex; flex-direction: column; gap: 14px; }
  .rw-pay-form__lead { font-size: 13px; color: var(--med); margin-bottom: 4px; }
  .rw-pay-form__note { font-size: 11px; color: var(--light); display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; }
  .rw-input--mono { font-family: "SF Mono", Menlo, monospace; font-size: 14px; letter-spacing: 0.02em; }
  .rw-donate__grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .rw-card-input { position: relative; }
  .rw-card-input input { padding-right: 130px; }
  .rw-card-input__brands { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; }
  .rw-brand { padding: 3px 6px; border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: 0.05em; }
  .rw-brand--visa { background: #1a1f71; color: #fff; }
  .rw-brand--mc   { background: #eb001b; color: #fff; font-size: 12px; padding: 1px 6px 3px; }
  .rw-brand--amex { background: #2e77bb; color: #fff; }

  .rw-paypal-box { background: #fff; border: 1px solid #003087; border-radius: 6px; padding: 18px; text-align: center; }
  .rw-paypal-box__mark { margin-bottom: 10px; }
  .rw-paypal-box p { font-size: 13px; color: var(--med); line-height: 1.6; }

  .rw-bank { display: grid; gap: 8px; margin: 4px 0 8px; }
  .rw-bank > div { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px dashed rgba(212,175,55,0.15); }
  .rw-bank > div:last-child { border-bottom: 0; }
  .rw-bank dt { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--light); }
  .rw-bank dd { font-size: 13px; color: var(--dark); }
  .rw-mono { font-family: "SF Mono", Menlo, monospace; letter-spacing: 0.03em; }

  .rw-trust { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.18); border-radius: 8px; }
  .rw-trust > div { display: flex; flex-direction: column; gap: 4px; }
  .rw-trust strong { font-family: "Cinzel", serif; font-size: 13px; color: var(--dark); font-weight: 500; }
  .rw-trust span { font-size: 11px; color: var(--med); line-height: 1.55; }

  /* Pulsing submit button when processing */
  .rw-btn.is-pulsing { animation: rw-btn-pulse 800ms ease-out; }
  @keyframes rw-btn-pulse {
    0%   { box-shadow: 0 4px 16px rgba(212,175,55,0.20); }
    50%  { box-shadow: 0 4px 16px rgba(212,175,55,0.20), 0 0 0 12px rgba(212,175,55,0.12); }
    100% { box-shadow: 0 4px 16px rgba(212,175,55,0.20), 0 0 0 36px rgba(212,175,55,0); }
  }

  /* ============================================================
     Generic stagger refinements
     ============================================================ */
  /* Add a subtle hover lift on the eye-catching feature icon */
  .rw-feature__icon { animation: none; }
  .rw-feature:hover .rw-feature__icon { animation: rw-icon-spin 600ms var(--ease-out); }
  @keyframes rw-icon-spin {
    0%   { transform: scale(1) rotate(0); }
    50%  { transform: scale(1.18) rotate(-6deg); }
    100% { transform: scale(1.1) rotate(0); }
  }

  /* Accessibility: respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .rw-fade, .rw-fade.is-in { opacity: 1; transform: none; transition: none; }
    .rw-pinnacle-glow, .rw-bird, .rw-hero--scene::before,
    .rw-lamp__flame, .rw-lamp__prompt, .rw-hero__scroll-dot { animation: none; }
  }

  /* ============================================================
     EVENT SCENES — generic
     ============================================================ */
  .rw-scene { position: absolute; inset: 0; overflow: hidden; }
  .rw-scene .rw-scene__svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ===== VESAK SCENE — deep blue night sky with lanterns ===== */
  .rw-scene--vesak {
    background: linear-gradient(180deg,
      #0a0418 0%,
      #1a0c2a 20%,
      #2a1438 45%,
      #3a1c4c 70%,
      #1a0c2a 100%);
  }
  .rw-vesak__strings { position: absolute; inset: 0; pointer-events: none; }
  .rw-lantern {
    position: absolute;
    width: 56px; height: 76px;
    transform-origin: 50% 0;
    animation: rw-lantern-sway 5s ease-in-out infinite;
  }
  @keyframes rw-lantern-sway {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }
  .rw-lantern__string {
    position: absolute; left: 50%; top: -40px;
    width: 1px; height: 40px; background: rgba(255,255,255,0.25);
    transform: translateX(-50%);
  }
  .rw-lantern__top {
    position: absolute; left: 50%; top: -2px;
    width: 14px; height: 4px; background: #f7d94e;
    border-radius: 2px 2px 0 0;
    transform: translateX(-50%);
    box-shadow: 0 0 8px rgba(247,217,78,0.6);
  }
  .rw-lantern__body {
    position: absolute; left: 0; top: 4px;
    width: 100%; height: 60px;
    border-radius: 45% 45% 55% 55% / 50% 50% 60% 60%;
    box-shadow:
      inset 0 -8px 16px rgba(0,0,0,0.30),
      inset 0 8px 12px rgba(255,255,255,0.30),
      0 0 28px var(--lantern-glow, rgba(247,217,78,0.55));
    overflow: hidden;
  }
  .rw-lantern__body::before {
    content: '';
    position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: rgba(0,0,0,0.20);
  }
  .rw-lantern__glow {
    position: absolute; inset: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--lantern-light, #fff4c8) 0%, var(--lantern-light, #fff4c8) 30%, transparent 70%);
    animation: rw-lantern-pulse 2.5s ease-in-out infinite;
  }
  @keyframes rw-lantern-pulse {
    0%, 100% { opacity: 0.95; }
    50%      { opacity: 0.75; }
  }
  .rw-lantern__tassel {
    position: absolute; left: 50%; bottom: -6px;
    width: 2px; height: 12px; background: #d4af37;
    transform: translateX(-50%);
    border-radius: 0 0 2px 2px;
  }
  .rw-lantern__tassel::after {
    content: ''; position: absolute; left: -3px; bottom: -4px;
    width: 8px; height: 6px; background: #d4af37;
    border-radius: 0 0 4px 4px;
  }
  /* Lantern colour variants */
  .rw-lantern--amber .rw-lantern__body { background: radial-gradient(circle at 50% 40%, #f8d97a, #d4af37); --lantern-glow: rgba(247,217,78,0.6); --lantern-light: #fff4c8; }
  .rw-lantern--rose  .rw-lantern__body { background: radial-gradient(circle at 50% 40%, #f4a8b8, #c04860); --lantern-glow: rgba(244,168,184,0.6); --lantern-light: #ffe0ea; }
  .rw-lantern--gold  .rw-lantern__body { background: radial-gradient(circle at 50% 40%, #fae8a0, #b8941f); --lantern-glow: rgba(250,232,160,0.6); --lantern-light: #fffaec; }

  /* ===== POSON SCENE — Mihintale at dawn ===== */
  .rw-scene--poson {
    background: linear-gradient(180deg,
      #0a1428 0%,
      #1c2848 18%,
      #3a3a5c 36%,
      #7a5a5c 56%,
      #c08858 76%,
      #f4c878 92%,
      #2a1c14 100%);
  }
  .rw-poson__moon-glow {
    position: absolute; left: 20%; top: 18%;
    width: 280px; height: 280px; pointer-events: none;
    background: radial-gradient(circle, rgba(255,248,212,0.25) 0%, transparent 60%);
    transform: translate(-50%, -50%);
    animation: rw-poson-pulse 5s ease-in-out infinite;
  }
  @keyframes rw-poson-pulse {
    0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.15); }
  }

  /* ===== ESALA SCENE — perahera at night ===== */
  .rw-scene--esala {
    background: linear-gradient(180deg,
      #1a0418 0%,
      #2a0820 25%,
      #3a1028 50%,
      #3a1010 80%,
      #1a0408 100%);
  }
  .rw-flame { transform-origin: 0 0; animation: rw-flame 0.6s ease-in-out infinite alternate; }
  .rw-flame--0 { animation-delay: 0s; }
  .rw-flame--1 { animation-delay: 0.2s; }
  .rw-flame--2 { animation-delay: 0.4s; }
  .rw-flame--3 { animation-delay: 0.1s; }
  @keyframes rw-flame {
    from { transform: scaleY(1) scaleX(1); }
    to   { transform: scaleY(1.15) scaleX(0.95); }
  }
  .rw-flame-glow { animation: rw-flame-glow 0.6s ease-in-out infinite alternate; }
  .rw-flame-glow--0 { animation-delay: 0s; }
  .rw-flame-glow--1 { animation-delay: 0.3s; }
  .rw-flame-glow--2 { animation-delay: 0.15s; }
  .rw-flame-glow--3 { animation-delay: 0.45s; }
  @keyframes rw-flame-glow {
    from { opacity: 0.15; transform-origin: center; transform: scale(1); }
    to   { opacity: 0.30; transform: scale(1.2); }
  }
  .rw-flame-big, .rw-flame-big2 { transform-origin: 0 0; animation: rw-flame 0.45s ease-in-out infinite alternate; }
  .rw-flame-big--0 { animation-delay: 0s; }
  .rw-flame-big--1 { animation-delay: 0.15s; }
  .rw-flame-big2--0 { animation-delay: 0.2s; }
  .rw-flame-big2--1 { animation-delay: 0.35s; }

  /* ===== POYA MOON SCENE ===== */
  .rw-scene--poya {
    background: linear-gradient(180deg,
      #02021a 0%,
      #060622 35%,
      #0a0a2e 65%,
      #06060c 100%);
  }
  .rw-lamp-flame { transform-origin: 0 100%; animation: rw-lamp-tick 1.6s ease-in-out infinite; }
  .rw-lamp-flame--0 { animation-delay: 0s; }
  .rw-lamp-flame--1 { animation-delay: 0.2s; }
  .rw-lamp-flame--2 { animation-delay: 0.4s; }
  .rw-lamp-flame--3 { animation-delay: 0.6s; }
  .rw-lamp-flame--4 { animation-delay: 0.8s; }
  .rw-lamp-flame--5 { animation-delay: 1.0s; }
  @keyframes rw-lamp-tick {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(0.9, 1.1); }
  }

  /* ===== ALMS SCENE — neutral cream with offering ===== */
  .rw-scene--alms {
    background: linear-gradient(180deg, #fef6e2 0%, #f6e2b2 60%, #d4a44a 100%);
  }
  .rw-scene--alms-dawal { background: linear-gradient(180deg, #fefbed 0%, #fae8b8 60%, #e8c068 100%); }
  .rw-scene--alms-gilana { background: linear-gradient(180deg, #f4cca0 0%, #d8884a 55%, #5a2c14 100%); }
  .rw-scene--alms-pooja  { background: linear-gradient(180deg, #fef0f4 0%, #f4c8d4 50%, #d48898 100%); }
  .rw-scene--alms-pirith { background: linear-gradient(180deg, #f8f4ec 0%, #ece0c8 50%, #b89a6c 100%); }

  .rw-steam__line { animation: rw-steam-rise 3s ease-in-out infinite; transform-origin: center; }
  .rw-steam__line--1 { animation-delay: 0s; }
  .rw-steam__line--2 { animation-delay: 0.6s; }
  .rw-steam__line--3 { animation-delay: 1.2s; }
  @keyframes rw-steam-rise {
    0%   { opacity: 0;   transform: translateY(20px); }
    30%  { opacity: 0.6; }
    100% { opacity: 0;   transform: translateY(-40px); }
  }
  .rw-alms__lotus { transform-origin: center; animation: rw-lotus-breathe 4s ease-in-out infinite; }
  @keyframes rw-lotus-breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  .rw-petal { animation: rw-petal-fall 10s linear infinite; }
  .rw-petal--1 { animation-delay: 0s;  animation-duration: 12s; }
  .rw-petal--2 { animation-delay: -3s; animation-duration: 14s; }
  .rw-petal--3 { animation-delay: -6s; animation-duration: 11s; }
  .rw-petal--4 { animation-delay: -9s; animation-duration: 13s; }
  .rw-petal--5 { animation-delay: -2s; animation-duration: 15s; }
  @keyframes rw-petal-fall {
    0%   { opacity: 0;   transform: translateY(-60px) rotate(0); }
    20%  { opacity: 0.7; }
    80%  { opacity: 0.7; }
    100% { opacity: 0;   transform: translateY(600px) rotate(720deg); }
  }

  /* ============================================================
     EVENT PAGE — featured upcoming event
     ============================================================ */
  .rw-event-feature {
    position: relative;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    min-height: 520px;
    background: #1a0c2a;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(212,175,55,0.20);
    cursor: pointer;
    transition: transform 400ms var(--ease-out), box-shadow 400ms;
  }
  .rw-event-feature:hover { transform: translateY(-3px); box-shadow: 0 24px 60px rgba(212,175,55,0.18); }
  @media (max-width: 900px) { .rw-event-feature { grid-template-columns: 1fr; min-height: 0; } }
  .rw-event-feature__scene { position: relative; min-height: 360px; }
  .rw-event-feature__scrim { display: none; }
  .rw-event-feature__body {
    padding: 56px 48px; color: #fff;
    background: linear-gradient(180deg, rgba(26,12,42,0) 0%, rgba(26,12,42,0.4) 100%);
    display: flex; flex-direction: column; justify-content: center; gap: 16px;
  }
  .rw-event-feature__title { font-family: "Cinzel", serif; font-size: clamp(2rem, 4vw, 2.8rem); letter-spacing: 0.02em; line-height: 1.1; color: #fff; font-weight: 400; }
  .rw-event-feature__sub { font-family: "Cinzel", serif; font-style: italic; font-size: 17px; color: rgba(255,255,255,0.8); }
  .rw-event-feature__blurb { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.75); margin-bottom: 4px; }
  .rw-event-feature .rw-btn--hero { align-self: flex-start; }

  /* ============================================================
     EVENT PAGE — Poya calendar grid
     ============================================================ */
  .rw-poya-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  @media (max-width: 980px) { .rw-poya-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 720px) { .rw-poya-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .rw-poya-grid { grid-template-columns: 1fr; } }

  .rw-poya-card {
    display: flex; gap: 16px; align-items: flex-start;
    padding: 22px 22px 20px;
    background: #fff;
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 10px;
    text-align: left;
    transition: all 300ms var(--ease-out);
  }
  .rw-poya-card:hover {
    border-color: rgba(212,175,55,0.45);
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(212,175,55,0.10);
  }
  .rw-poya-card__moon {
    width: 40px; height: 40px; border-radius: 9999px; flex-shrink: 0;
    background: radial-gradient(circle at 35% 35%, #fffae0, #f7d94e);
    box-shadow: 0 0 16px rgba(247,217,78,0.30), inset 0 0 8px rgba(0,0,0,0.10);
    position: relative;
  }
  .rw-poya-card__phase {
    position: absolute; inset: 4px;
    border-radius: 9999px;
    background: radial-gradient(circle at 30% 30%, transparent 50%, rgba(0,0,0,0.06) 100%);
  }
  /* Vesak / Poson / Esala cards get a special accent treatment */
  .rw-poya-card--vesak  { background: linear-gradient(135deg, #fff 0%, #fdf4e0 100%); }
  .rw-poya-card--vesak  .rw-poya-card__moon { background: radial-gradient(circle at 35% 35%, #fff8d4, #d4af37); box-shadow: 0 0 24px rgba(212,175,55,0.5); }
  .rw-poya-card--poson  .rw-poya-card__moon { background: radial-gradient(circle at 35% 35%, #ffeac8, #c77b2b); }
  .rw-poya-card--esala  .rw-poya-card__moon { background: radial-gradient(circle at 35% 35%, #ffd0b0, #a82820); box-shadow: 0 0 18px rgba(168,40,32,0.40); }

  .rw-poya-card__body { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .rw-poya-card__month { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--light); font-weight: 500; }
  .rw-poya-card__name { font-family: "Cinzel", serif; font-size: 17px; color: var(--dark); font-weight: 500; line-height: 1.2; }
  .rw-poya-card__sinhala { font-family: "Cinzel", serif; font-size: 13px; color: var(--pinnacle-gold); margin-bottom: 6px; }
  .rw-poya-card__sub { font-size: 12px; color: var(--med); line-height: 1.5; }
  .rw-poya-card__date { font-size: 11px; color: var(--light); margin-top: 8px; letter-spacing: 0.05em; }

  /* ============================================================
     EVENT PAGE — Daily observances
     ============================================================ */
  .rw-daily-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  @media (max-width: 880px) { .rw-daily-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 540px) { .rw-daily-grid { grid-template-columns: 1fr; } }

  .rw-daily-card {
    display: flex; flex-direction: column; gap: 6px;
    padding: 26px 26px 24px;
    background: linear-gradient(180deg, #fff 0%, var(--cream) 100%);
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 10px;
    text-align: left;
    transition: all 300ms var(--ease-out);
  }
  .rw-daily-card:hover {
    border-color: rgba(212,175,55,0.40);
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(212,175,55,0.10);
  }
  .rw-daily-card__time { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--pinnacle-gold); font-weight: 500; margin-bottom: 10px; }
  .rw-daily-card__sun { display: inline-flex; }
  .rw-daily-card__title { font-family: "Cinzel", serif; font-size: 20px; color: var(--dark); font-weight: 500; line-height: 1.2; }
  .rw-daily-card__sinhala { font-family: "Cinzel", serif; font-size: 14px; color: var(--pinnacle-gold); margin-bottom: 8px; }
  .rw-daily-card__sub { font-size: 13px; color: var(--med); line-height: 1.6; margin-bottom: 14px; }
  .rw-daily-card__more { margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--pinnacle-gold); }

  /* ============================================================
     EVENT DETAIL VIEW
     ============================================================ */
  .rw-event-detail { padding-top: 0; }
  .rw-event-detail__hero {
    position: relative;
    height: 64vh; min-height: 420px;
    padding-top: 80px;
    display: flex; align-items: flex-end;
    overflow: hidden;
  }
  .rw-event-detail__scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.20) 0%, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.75) 100%);
    z-index: 1;
  }
  .rw-event-detail__hero-inner { position: relative; z-index: 2; padding: 0 28px 56px; color: #fff; max-width: 1200px; margin: 0 auto; width: 100%; }
  .rw-event-detail__title { font-family: "Cinzel", serif; font-size: clamp(2.5rem, 6vw, 4.2rem); letter-spacing: 0.02em; line-height: 1.05; color: #fff; margin: 12px 0 4px; font-weight: 400; }
  .rw-event-detail__sinhala { font-family: "Cinzel", serif; font-size: 22px; color: rgba(247,217,78,0.9); margin-bottom: 14px; }
  .rw-event-detail__sub { font-family: "Cinzel", serif; font-style: italic; font-size: 18px; color: rgba(255,255,255,0.82); max-width: 720px; }
  .rw-event-detail__date {
    display: inline-block; margin-top: 18px;
    padding: 8px 18px;
    border: 1px solid rgba(255,255,255,0.30);
    border-radius: 9999px;
    background: rgba(0,0,0,0.20);
    backdrop-filter: blur(8px);
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #fff;
  }

  .rw-event-detail__body { padding: 72px 28px 80px; }
  .rw-event-detail__grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 32px;
    margin: 36px 0 12px;
    padding: 28px 32px;
    background: var(--cream);
    border: var(--border-gold);
    border-radius: 10px;
  }
  @media (max-width: 600px) { .rw-event-detail__grid { grid-template-columns: 1fr; } }
  .rw-detail-row { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; }
  .rw-detail-row__lbl { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--light); font-weight: 500; }
  .rw-detail-row__val { font-size: 14px; color: var(--dark); line-height: 1.5; }

  .rw-event-cta { margin-top: 48px; padding: 32px 36px; background: linear-gradient(135deg, rgba(212,175,55,0.06), rgba(199,123,43,0.04)); border: var(--border-gold-strong); border-radius: 12px; }
  .rw-event-cta__row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

  /* ============================================================
     GALLERY/BLOG TILE SCENES — animated illustrated thumbnails
     ============================================================ */
  .rw-photo--scene { position: relative; aspect-ratio: 4/5; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 700ms var(--ease-out); }
  .rw-photo--scene:hover { transform: scale(1.02); }
  .rw-tile-scene { position: absolute; inset: 0; overflow: hidden; }
  .rw-tile-scene__svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Golden Hour: warm sunset gradient sky */
  .rw-tile-scene--golden {
    background: linear-gradient(180deg,
      #2a1410 0%,
      #5a2810 18%,
      #b04818 38%,
      #d96c20 58%,
      #f4a850 76%,
      #fae0a0 90%,
      #3a1808 100%);
  }
  /* Sacred Night: deep blue starlit sky */
  .rw-tile-scene--night {
    background: linear-gradient(180deg,
      #020410 0%,
      #060828 25%,
      #0a1040 55%,
      #14184a 80%,
      #04020a 100%);
  }
  /* Devotion: soft warm temple-glow */
  .rw-tile-scene--devotion {
    background: linear-gradient(180deg,
      #f4d6a0 0%,
      #e8b878 35%,
      #c08850 65%,
      #5a3018 100%);
  }
  /* Dawn: pale dawn warm sky */
  .rw-tile-scene--dawn {
    background: linear-gradient(180deg,
      #2a2a4a 0%,
      #6a4a3a 25%,
      #c4825a 55%,
      #f0c890 80%,
      #1a0c08 100%);
  }
  /* Elephant Wall: warm stone */
  .rw-tile-scene--wall {
    background: linear-gradient(180deg, #5a3c24 0%, #4a3018 50%, #2a1408 100%);
  }
  /* Lamp: dark with warm halos */
  .rw-tile-scene--lamp {
    background: linear-gradient(180deg, #1a0e08 0%, #2a1810 40%, #1a0c08 100%);
  }
  /* Procession: night with moon */
  .rw-tile-scene--procession {
    background: linear-gradient(180deg, #02041a 0%, #0a1438 50%, #1a1238 100%);
  }

  /* Animation primitives */
  .rw-tile-pulse {
    transform-origin: center;
    animation: rw-tile-pulse 4s ease-in-out infinite;
  }
  @keyframes rw-tile-pulse {
    0%, 100% { transform: scale(1);    opacity: 0.22; }
    50%      { transform: scale(1.15); opacity: 0.35; }
  }

  .rw-tile-pinnacle {
    animation: rw-tile-pinnacle 2.5s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes rw-tile-pinnacle {
    0%, 100% { filter: brightness(1)   drop-shadow(0 0 2px #f7d94e); }
    50%      { filter: brightness(1.4) drop-shadow(0 0 6px #f7d94e); }
  }

  .rw-tile-bird { animation: rw-tile-bird 18s linear infinite; transform-origin: center; }
  .rw-tile-bird--1 { animation-delay: 0s; }
  .rw-tile-bird--2 { animation-delay: -6s; }
  .rw-tile-bird--3 { animation-delay: -12s; animation-direction: reverse; }
  @keyframes rw-tile-bird {
    0%   { transform: translate(-30px, 0); opacity: 0; }
    20%  { opacity: 0.6; }
    80%  { opacity: 0.6; }
    100% { transform: translate(120px, -10px); opacity: 0; }
  }

  .rw-tile-star { animation: rw-tile-twinkle 2.5s ease-in-out infinite; }
  .rw-tile-star--0 { animation-delay: 0s; }
  .rw-tile-star--1 { animation-delay: 0.5s; }
  .rw-tile-star--2 { animation-delay: 1.0s; }
  .rw-tile-star--3 { animation-delay: 1.5s; }
  .rw-tile-star--4 { animation-delay: 2.0s; }
  @keyframes rw-tile-twinkle {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 1; }
  }

  .rw-tile-flame { transform-origin: 0 100%; animation: rw-tile-flame 1.2s ease-in-out infinite; }
  .rw-tile-flame--0 { animation-delay: 0s; }
  .rw-tile-flame--1 { animation-delay: 0.2s; }
  .rw-tile-flame--2 { animation-delay: 0.4s; }
  .rw-tile-flame--3 { animation-delay: 0.6s; }
  .rw-tile-flame--4 { animation-delay: 0.8s; }
  .rw-tile-flame--5 { animation-delay: 1.0s; }
  @keyframes rw-tile-flame {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(0.85, 1.15); }
  }

  .rw-tile-glow { animation: rw-tile-glow 3s ease-in-out infinite; }
  .rw-tile-glow--0 { animation-delay: 0s; }
  .rw-tile-glow--1 { animation-delay: 0.7s; }
  .rw-tile-glow--2 { animation-delay: 1.4s; }
  .rw-tile-glow--3 { animation-delay: 2.1s; }
  @keyframes rw-tile-glow {
    0%, 100% { opacity: 0.12; }
    50%      { opacity: 0.25; }
  }

  .rw-tile-smoke { animation: rw-tile-smoke 5s ease-in-out infinite; transform-origin: bottom; }
  .rw-tile-smoke--1 { animation-delay: 0s; }
  .rw-tile-smoke--2 { animation-delay: 1.6s; }
  .rw-tile-smoke--3 { animation-delay: 3.2s; }
  @keyframes rw-tile-smoke {
    0%   { opacity: 0;    transform: translateY(20px) scaleY(1);    }
    25%  { opacity: 0.45; }
    100% { opacity: 0;    transform: translateY(-40px) scaleY(1.4); }
  }

  .rw-tile-petal { animation: rw-tile-petal 10s linear infinite; transform-origin: center; }
  .rw-tile-petal--1 { animation-delay: 0s;   animation-duration: 11s; }
  .rw-tile-petal--2 { animation-delay: -3s;  animation-duration: 13s; }
  .rw-tile-petal--3 { animation-delay: -6s;  animation-duration: 12s; }
  .rw-tile-petal--4 { animation-delay: -9s;  animation-duration: 14s; }
  @keyframes rw-tile-petal {
    0%   { opacity: 0;    transform: translateY(-50px) rotate(0); }
    15%  { opacity: 0.7; }
    85%  { opacity: 0.7; }
    100% { opacity: 0;    transform: translateY(550px) rotate(540deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .rw-tile-pulse, .rw-tile-pinnacle, .rw-tile-bird, .rw-tile-star,
    .rw-tile-flame, .rw-tile-glow, .rw-tile-smoke, .rw-tile-petal { animation: none; }
  }
</style>
</head>
